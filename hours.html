<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="author" content="zaynab Emadi" />
    <meta
      name="description"
      content="The official website for The Little Taco Shop"
    />
    <title>LTS Hours</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <header class="header">
      <h1 class="header__h1">Little Taco Shop</h1>
      <nav class="header__nav">
        <ul class="header__ul">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#menu">Menu</a></li>
          <li><a href="contact.html">Contact</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </header>
    <section class="hero">
      <figure>
        <img
          src="/img/tacos_tray_1000x667.png"
          alt="A Tray of Tasty Tacos"
          width="1000"
          height="667"
        />
        <figcaption class="offscreen">A Tray of Tasty Tacos</figcaption>
      </figure>
    </section>
    <main class="main">
      <article class="main__article">
        <h2 class="hours">Hours</h2>
        <p class="hours__paragraph">We are open 7 days a week!</p>
        <dl class="hours__list">
          <dt>Sunday-Thursday</dt>
          <dd class="hours__detail">
            <time datetime="11:00">11am</time>-<time datetime="21:00">9pm</time>
          </dd>
          <dt>Friday-Saturday</dt>
          <dd class="hours__detail">
            <time datetime="11:00">11am</time>-<time datetime="23:00"
              >11pm</time
            >
          </dd>
        </dl>
      </article>
    </main>
    <footer class="footer">
      <p>
        <span class="nowrap">Copyright &copy;<time id="year"></time></span>
        <span class="nowrap">The Little Taco Shop</span>
      </p>
    </footer>
  </body>
</html>
