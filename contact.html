<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" >
    <meta name="viewport" content="width=device-width, initial-scale=1.0" >
    <meta http-equiv="X-UA-Compatible" content="ie=edge" >
    <meta name="author" content="zaynab Emadi" >
    <meta
      name="description"
      content="The official website for The Little Taco Shop"
    >
    <title>LTS Contact</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" >
    <link rel="stylesheet" type="text/css" href="styles/style.css" >
  </head>
  <body>
    <header>
      <h1>Contact Us</h1>
      <nav>
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#about">About LTS</a></li>
          <li><a href="index.html#menu">Our Menu</a></li>
          <li><a href="hours.html">Store Hours</a></li>
        </ul>
      </nav>
      <figure>
        <img
          src="/img/tacos_close_up_400x260.png"
          alt="Little Taco Shop Tacos"
          width="400"
          height="260"
        >
        <figcaption>Little Taco Shop Tacos</figcaption>
      </figure>
    </header>
    <hr>
    <main>
      <section>
        <h2>Our Contact Form</h2>
        <form action="https://httpbin.org/get" method="get">
          <fieldset>
            <legend>Send Us A Massage</legend>
            <p>
              <label for="name">Name : </label>
              <input
                type="text"
                name="name"
                placeholder="Your Name"
                id="name"
                required
              >
            </p>
            <p>
              <label for="email">Email : </label>
              <input
                type="email"
                name="email"
                placeholder="Your Email"
                id="email"
                required
              >
            </p>
            <p>
              <label for="massage">Your Massage:</label>
              <br >
              <textarea
                name="massage"
                id="massage"
                cols="30"
                rows="10"
                placeholder="Type your massage here"
              ></textarea>
            </p>
          </fieldset>
          <button type="submit">Send</button>
          <button type="reset">Reset</button>
        </form>
      </section>
      <section>
        <h2>Our Location</h2>
        <address>
          555 Taco Temptation Lane,Suite T<br >
            Kansas City; MO 55555-5555
            <br><br>
            Phone:<a href="tel:555-555-5555">555-555-5555</a>
        </address>
        <p>
          <a href="#">Back To Top</a>
        </p>
      </section>
    </main>
    <hr >
    <footer>
      <p>Copyright &copy; The Little Taco Shop</p>
    </footer>
  </body>
</html>
