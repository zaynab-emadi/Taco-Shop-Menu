<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <meta name="author" content="zaynab Emadi" />
    <meta
      name="description"
      content="The official website for The Little Taco Shop"
    />
    <title>LTS Contact</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <link rel="stylesheet" type="text/css" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <h1 class="header__h1">Little Taco Shop</h1>
      <nav class="header__nav">
        <ul class="header__ul">
          <li><a href="index.html">Home</a></li>
          <li><a href="index.html#menu">Menu</a></li>
          <li><a href="hours.html">Hours</a></li>
          <li><a href="about.html">About</a></li>
        </ul>
      </nav>
    </header>
    <section class="hero">
      <figure>
        <img
          src="/img/tacos_close_up_1000x649.png"
          alt="Little Taco Shop Tacos"
          width="1000"
          height="649"
        />
        <figcaption class="offscreen">Little Taco Shop Tacos</figcaption>
      </figure>
    </section>
    <main class="main">
      <article class="main__article">
        <h2>Our Location</h2>
        <address>
          555 Taco Temptation Lane,Suite T<br />
          Kansas City; MO 55555-5555
          <br /><br />
          Phone:<a href="tel:555-555-5555">555-555-5555</a>
        </address>
        <p>
          <a href="#">Back To Top</a>
        </p>
      </article>
      <article class="main__article contact">
        <h2 class="contact__h2">Our Contact Form</h2>
        <form
          action="https://httpbin.org/get"
          method="get"
          class="contact__form"
        >
          <fieldset class="contact__fieldset">
            <legend class="offscreen">Send Us A Massage</legend>
            <p class="contact__p">
              <label class="contact__label" for="name">Name : </label>
              <input
                class="contact__input"
                type="text"
                name="name"
                placeholder="Your Name"
                id="name"
                required
              />
            </p>
            <p class="contact__p">
              <label class="contact__label" for="email">Email : </label>
              <input
                class="contact__input"
                type="email"
                name="email"
                placeholder="Your Email"
                id="email"
                required
              />
            </p>
            <p class="contact__p">
              <label class="contact__label" for="massage">Your Massage:</label>
              <br />
              <textarea
                class="contact__textarea"
                name="massage"
                id="massage"
                cols="30"
                rows="10"
                placeholder="Type your massage here"
              ></textarea>
            </p>
          </fieldset>
          <button class="contact__button" type="submit">Send</button>
          <button class="contact__button" type="reset">Reset</button>
        </form>
      </article>
    </main>
    <footer class="footer">
      <p>
        <span class="nowrap">Copyright &copy;</span>
        <span class="nowrap">The Little Taco Shop</span>
      </p>
    </footer>
  </body>
</html>
